<app-hero></app-hero>

@if (latestArticles.length > 0) {
  <section class="allpost_article">
    @for (article of latestArticles; track article.id) {
      <app-article-card
        [article]="article"
        (delete)="deleteArticle($event)"
      ></app-article-card>
    }
    <button><a routerLink="/blog">Browse all posts</a></button>
  </section>
}
